  <body>
    <main id="demo">
      <noscript>
        <h1>Abomerration</h1>
        <p>
          Chromatic aberration as an FFGL effect for Resolume and an OpenFX
          plugin for Resolve. It smears the whole visible spectrum along a path
          and adds it up, rather than offsetting three channels, and the beat
          and the spectrum of the music can drive it.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/abomerration">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/abomerration/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/abomerration/guide/">User guide</a></li>

        </ul>
